<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - MARK VIII</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --hud-primary: #00ffff;
            --hud-dim: rgba(0, 255, 255, 0.3);
            --hud-secondary: #0088ff;
            --armor-gold: #f5d300;
            --alert-red: #ff3333;
            --bg-color: #050505;
        }

        body {
            background-color: var(--bg-color);
            color: var(--hud-primary);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        /* === 1. 环境特效 (粒子与网格) === */
        .bg-overlay {
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(0, 80, 80, 0.2) 0%, transparent 70%);
            z-index: -2;
        }
        
        .grid-floor {
            position: absolute;
            width: 200%; height: 100%;
            bottom: -50%;
            background: linear-gradient(0deg, transparent 24%, rgba(0, 255, 255, .05) 25%, rgba(0, 255, 255, .05) 26%, transparent 27%, transparent 74%, rgba(0, 255, 255, .05) 75%, rgba(0, 255, 255, .05) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(0, 255, 255, .05) 25%, rgba(0, 255, 255, .05) 26%, transparent 27%, transparent 74%, rgba(0, 255, 255, .05) 75%, rgba(0, 255, 255, .05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            animation: gridMove 20s linear infinite;
            z-index: -2;
        }

        @keyframes gridMove { 0% { transform: perspective(500px) rotateX(60deg) translateY(0); } 100% { transform: perspective(500px) rotateX(60deg) translateY(50px); } }

        /* 漂浮粒子 */
        .particle {
            position: absolute;
            background: var(--hud-primary);
            width: 2px; height: 2px;
            border-radius: 50%;
            opacity: 0.5;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp { 0% { transform: translateY(100vh); opacity:0; } 50% { opacity:0.8; } 100% { transform: translateY(-10vh); opacity:0; } }

        /* === 2. 反应堆核心区 (能量环) === */
        .center-stage {
            position: relative;
            width: 400px; height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 外部能量刻度环 */
        .energy-scale-ring {
            position: absolute;
            width: 360px; height: 360px;
            border-radius: 50%;
            border: 2px dashed var(--hud-dim);
            animation: rotateSlow 60s linear infinite;
        }

        /* 动态能量条 (扇形) */
        .power-arc {
            position: absolute;
            width: 340px; height: 340px;
            border-radius: 50%;
            border: 10px solid transparent;
            border-top-color: var(--hud-primary);
            border-right-color: var(--hud-primary);
            opacity: 0.7;
            transform: rotate(-45deg);
            filter: drop-shadow(0 0 5px var(--hud-primary));
            transition: all 0.5s;
        }
        
        .power-arc::after {
            content: '100%';
            position: absolute;
            top: -30px; right: 20px;
            font-size: 14px;
            color: var(--hud-primary);
            text-shadow: 0 0 5px var(--hud-primary);
            transform: rotate(45deg); /* 修正文字角度 */
        }

        /* 反应堆本体 */
        .reactor-container {
            width: 220px; height: 220px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 10;
        }
        .reactor-container:active { transform: scale(0.95); }

        .core-glow {
            width: 80px; height: 80px;
            background: radial-gradient(circle, #fff, var(--hud-primary), transparent);
            border-radius: 50%;
            box-shadow: 0 0 60px var(--hud-primary);
            animation: breathe 3s ease-in-out infinite;
        }

        .triangle-ring {
            position: absolute;
            width: 100%; height: 100%;
            border: 1px solid var(--hud-dim);
            border-radius: 50%;
        }
        .triangle-ring::before {
            content: ''; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; 
            border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 15px solid var(--armor-gold);
        }

        /* 旋转的机械环 */
        .mech-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top: 2px solid var(--hud-primary);
            border-bottom: 2px solid var(--hud-primary);
        }
        .r1 { width: 180px; height: 180px; animation: spin 4s linear infinite; }
        .r2 { width: 140px; height: 140px; animation: spinReverse 6s linear infinite; border-color: var(--hud-dim); border-left: 2px solid var(--hud-primary); }

        /* === 3. 左右 HUD 小部件 === */
        .hud-widget {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 200px;
            padding: 15px;
            border-left: 2px solid var(--hud-primary);
            background: linear-gradient(90deg, rgba(0,255,255,0.05), transparent);
        }

        .widget-left { left: 50px; text-align: left; }
        .widget-right { right: 50px; text-align: right; border-left: none; border-right: 2px solid var(--armor-gold); }

        .widget-title {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #fff;
        }

        .stat-row {
            display: flex; justify-content: space-between;
            font-size: 12px; margin-bottom: 5px; color: var(--hud-dim);
        }
        .stat-val { color: var(--hud-primary); }
        .stat-val.gold { color: var(--armor-gold); }

        /* 左侧条形图 */
        .bar-graph { display: flex; gap: 2px; height: 10px; margin-top: 5px; }
        .bg-segment { width: 10%; background: var(--hud-dim); }
        .bg-segment.active { background: var(--hud-primary); box-shadow: 0 0 5px var(--hud-primary); }

        /* === 4. 文字日志与状态 === */
        #ui-layer {
            position: absolute;
            top: 15%;
            width: 100%;
            text-align: center;
        }

        #status-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 28px;
            letter-spacing: 8px;
            font-weight: 700;
            text-shadow: 0 0 15px var(--hud-primary);
        }

        #log-window {
            position: absolute;
            bottom: 10%;
            width: 500px;
            height: 120px;
            font-size: 13px;
            color: var(--hud-primary);
            text-shadow: 0 0 2px var(--hud-primary);
            overflow: hidden;
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
            border-left: 2px solid var(--armor-gold);
            padding-left: 15px;
        }

        /* 状态颜色 */
        .listening .core-glow { box-shadow: 0 0 80px #00ff00; background: radial-gradient(circle, #fff, #00ff00, transparent); }
        .listening .power-arc { border-top-color: #00ff00; border-right-color: #00ff00; }
        
        .thinking .core-glow { box-shadow: 0 0 80px var(--hud-secondary); background: radial-gradient(circle, #fff, var(--hud-secondary), transparent); }
        .thinking .mech-ring { border-color: transparent; border-top-color: var(--hud-secondary); }

        .speaking .core-glow { animation: rapidPulse 0.1s infinite; box-shadow: 0 0 100px #ff00de; background: radial-gradient(circle, #fff, #ff00de, transparent); }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spinReverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
        @keyframes rotateSlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes breathe { 0%,100% { opacity:0.8; transform:scale(1); } 50% { opacity:1; transform:scale(1.1); } }
        @keyframes rapidPulse { 0%,100% { opacity:0.9; transform:scale(1); } 50% { opacity:1; transform:scale(1.15); } }

    </style>
</head>
<body>

    <div class="bg-overlay"></div>
    <div class="grid-floor"></div>

    <div id="particle-container"></div>

    <div class="hud-widget widget-left">
        <div class="widget-title">ARMOR STATUS</div>
        <div class="stat-row"><span>INTEGRITY</span> <span class="stat-val">100%</span></div>
        <div class="stat-row"><span>PRESSURE</span> <span class="stat-val">NORMAL</span></div>
        <div class="bar-graph">
            <div class="bg-segment active"></div><div class="bg-segment active"></div>
            <div class="bg-segment active"></div><div class="bg-segment active"></div>
            <div class="bg-segment active"></div><div class="bg-segment active"></div>
            <div class="bg-segment active"></div><div class="bg-segment"></div>
        </div>
    </div>

    <div class="hud-widget widget-right">
        <div class="widget-title" style="color:var(--armor-gold)">POWER OUTPUT</div>
        <div class="stat-row"><span>VOLTAGE</span> <span class="stat-val gold">480V</span></div>
        <div class="stat-row"><span>AMPERAGE</span> <span class="stat-val gold" id="amp-val">2.4kA</span></div>
        <div class="stat-row"><span>CORE TEMP</span> <span class="stat-val">3400K</span></div>
    </div>

    <div id="ui-layer">
        <div style="font-size:12px; letter-spacing:4px; opacity:0.7; margin-bottom:5px;">PROTOCOL: MARK VIII</div>
        <div id="status-label">ONLINE</div>
    </div>

    <div class="center-stage">
        <div class="energy-scale-ring"></div>
        <div class="power-arc"></div>

        <div class="reactor-container" onclick="toggleJarvis()">
            <div class="triangle-ring"></div>
            <div class="mech-ring r1"></div>
            <div class="mech-ring r2"></div>
            <div class="core-glow"></div>
        </div>
    </div>

    <div id="log-window">
        <div>> INITIALIZING ARC REACTOR...</div>
        <div>> OUTPUT: 3GJ/s...</div>
        <div>> WAITING FOR VOICE COMMAND...</div>
    </div>

<script>
    // ================= 配置区 =================
    // ?? 填入你的 Key
    const CONFIG = {
        DEEPSEEK_KEY: "sk-98651ad58d6c4f3882c381d0aa4b2d1a", 
        ELEVENLABS_KEY: "sk_c8269afa67a9694f9da48e2ded5c5163bafb60d0ef0b6580",
        VOICE_ID: "TxGEqnHWrfWFTfGW9XjX", 
        MODEL_ID: "eleven_multilingual_v2"
    };

    const API = {
        DS: "https://api.deepseek.com/chat/completions",
        EL: `https://api.elevenlabs.io/v1/text-to-speech/${CONFIG.VOICE_ID}`
    };

    // ================= 逻辑区 =================
    let state = { isActive: false, isSpeaking: false };
    
    const centerStage = document.querySelector('.center-stage');
    const statusLabel = document.getElementById('status-label');
    const logDiv = document.getElementById('log-window');
    const ampVal = document.getElementById('amp-val');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN'; 
    recognition.continuous = false;

    // 1. 生成背景粒子
    function createParticles() {
        const container = document.getElementById('particle-container');
        for(let i=0; i<30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (Math.random() * 5 + 5) + 's';
            p.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(p);
        }
    }
    createParticles();

    // 2. 模拟能量波动
    setInterval(() => {
        // 随机跳动电流值
        const val = (2.0 + Math.random()).toFixed(1);
        ampVal.innerText = val + "kA";
    }, 200);

    // 3. 核心功能
    function toggleJarvis() {
        if (!state.isActive) {
            state.isActive = true;
            logTypewriter("> SYSTEM ENGAGED.");
            updateUI('listening', "LISTENING");
            recognition.start();
        } else {
            state.isActive = false;
            recognition.stop();
            updateUI('idle', "OFFLINE");
            logTypewriter("> SYSTEM DISENGAGED.");
        }
    }

    async function askDeepSeek(text) {
        updateUI('thinking', "COMPUTING");
        
        try {
            const res = await fetch(API.DS, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${CONFIG.DEEPSEEK_KEY}` },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [
                        { role: "system", content: "You are J.A.R.V.I.S. Reply in English. Keep it very short, cool, and loyal." },
                        { role: "user", content: text }
                    ]
                })
            });

            const data = await res.json();
            const reply = data.choices[0].message.content;
            
            logTypewriter(`> J.A.R.V.I.S.: ${reply}`);
            speakWithElevenLabs(reply);

        } catch (e) {
            logTypewriter(`> ERROR: ${e.message}`);
            updateUI('idle', "ERROR");
        }
    }

    async function speakWithElevenLabs(text) {
        updateUI('speaking', "SPEAKING");
        state.isSpeaking = true;

        try {
            const res = await fetch(API.EL, {
                method: "POST",
                headers: { "xi-api-key": CONFIG.ELEVENLABS_KEY, "Content-Type": "application/json" },
                body: JSON.stringify({
                    text: text,
                    model_id: CONFIG.MODEL_ID,
                    voice_settings: { stability: 0.5, similarity_boost: 0.8 }
                })
            });

            const blob = await res.blob();
            const audio = new Audio(URL.createObjectURL(blob));
            audio.play();

            audio.onended = () => {
                state.isSpeaking = false;
                if (state.isActive) {
                    updateUI('listening', "LISTENING");
                    recognition.start();
                } else {
                    updateUI('idle', "ONLINE");
                }
            };
        } catch (e) {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.onend = () => { if(state.isActive) recognition.start(); };
            window.speechSynthesis.speak(u);
        }
    }

    recognition.onstart = () => { updateUI('listening', "LISTENING"); };
    recognition.onend = () => {
        if (state.isActive && !state.isSpeaking && statusLabel.innerText !== "COMPUTING") {
            recognition.start();
        }
    };
    recognition.onresult = (e) => {
        const cmd = e.results[0][0].transcript;
        logTypewriter(`> CMD: ${cmd}`);
        recognition.stop();
        askDeepSeek(cmd);
    };

    function updateUI(cls, text) {
        centerStage.className = 'center-stage ' + cls;
        statusLabel.innerText = text;
        
        // 颜色动态切换
        const color = cls === 'listening' ? '#00ff00' : 
                      cls === 'thinking' ? '#0088ff' : 
                      cls === 'speaking' ? '#ff00de' : '#00ffff';
        
        statusLabel.style.color = color;
        statusLabel.style.textShadow = `0 0 15px ${color}`;
    }

    function logTypewriter(text) {
        const line = document.createElement('div');
        logDiv.appendChild(line);
        logDiv.scrollTop = logDiv.scrollHeight;
        let i = 0;
        const type = () => {
            if (i < text.length) {
                line.textContent += text.charAt(i);
                i++;
                setTimeout(type, 15);
            }
        };
        type();
    }
</script>
</body>
</html>
